
name: Merge IPTV Playlists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: merge-iptv-playlists
  cancel-in-progress: false

jobs:
  merge-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download, filter and merge playlists
        shell: bash
        run: |
          cat > merge_playlists.py <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          OUTPUT = Path("combined.m3u")

          HEADERS = {
              "User-Agent": "Mozilla/5.0 IPTV-Playlist-Merger"
          }

          SOURCES = [
              {
                  "name": "Tamil",
                  "url": "https://iptv-org.github.io/iptv/languages/tam.m3u",
                  "filter": None,
              },
              {
                  "name": "Tamil Local TV",
                  "url": "https://tinyurl.com/amaze-tamil-local-tv-withproxy",
                  "filter": None,
              },
              {
                  "name": "Movies",
                  "url": "https://iptv-org.github.io/iptv/categories/movies.m3u",
                  "filter": "language",
              },
              {
                  "name": "Series",
                  "url": "https://iptv-org.github.io/iptv/categories/series.m3u",
                  "filter": "language",
              },
              {
                  "name": "Kids",
                  "url": "https://iptv-org.github.io/iptv/categories/kids.m3u",
                  "filter": "language",
              },
              {
                  "name": "Infotainment - Documentary",
                  "url": "https://iptv-org.github.io/iptv/categories/documentary.m3u",
                  "filter": "language",
              },
              {
                  "name": "Infotainment - Education",
                  "url": "https://iptv-org.github.io/iptv/categories/education.m3u",
                  "filter": "language",
              },
              {
                  "name": "Infotainment - Science",
                  "url": "https://iptv-org.github.io/iptv/categories/science.m3u",
                  "filter": "language",
              },
              {
                  "name": "English",
                  "url": "https://iptv-org.github.io/iptv/languages/eng.m3u",
                  "filter": None,
              },
          ]

          ALLOWED_LANGUAGES = {"eng", "tam"}
          TIMEOUT = 30

          def download(url):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=TIMEOUT) as response:
                  data = response.read()
              return data.decode("utf-8-sig", errors="replace")

          def load_channel_languages():
              url = "https://iptv-org.github.io/api/feeds.json"
              try:
                  data = json.loads(download(url))
                  languages = {}
                  for feed in data:
                      channel = feed.get("channel")
                      feed_languages = set(feed.get("languages") or [])
                      if channel:
                          languages.setdefault(channel, set()).update(
                              feed_languages
                          )
                  print(
                      f"Loaded language metadata for {len(languages)} channels."
                  )
                  return languages
              except Exception as exc:
                  print(f"WARNING: Could not load feed metadata: {exc}")
                  return {}

          def get_tvg_id(extinf):
              match = re.search(r'tvg-id="([^"]*)"', extinf, re.IGNORECASE)
              return match.group(1).strip() if match else ""

          def language_allowed(extinf, channel_languages):
              # Prefer IPTV-org's channel ID and feed language metadata.
              channel_id = get_tvg_id(extinf)
              if channel_id and channel_id in channel_languages:
                  return bool(
                      channel_languages[channel_id] & ALLOWED_LANGUAGES
                  )

              # Fallback to explicit language metadata in the M3U entry.
              match = re.search(
                  r'tvg-language="([^"]*)"', extinf, re.IGNORECASE
              )
              if match:
                  values = {
                      value.strip().lower()
                      for value in re.split(r"[,;/|]", match.group(1))
                  }
                  return bool(values & {
                      "eng", "tam", "en", "ta", "english", "tamil"
                  })

              # No reliable language metadata: do not include it in
              # language-restricted categories.
              return False

          def parse_playlist(text):
              lines = [line.strip() for line in text.splitlines()]
              if not any(line.upper().startswith("#EXTM3U") for line in lines):
                  raise ValueError("Response is not a valid M3U playlist")

              entries = []
              pending = []
              for line in lines:
                  if not line:
                      continue
                  if line.startswith("#EXTM3U"):
                      continue
                  if line.startswith("#EXTINF"):
                      pending = [line]
                  elif line.startswith("#"):
                      if pending:
                          pending.append(line)
                  elif re.match(r"^(https?|rtmp|rtmps|rtsp|udp)://", line, re.I):
                      if pending:
                          pending.append(line)
                          entries.append(pending)
                          pending = []
                  else:
                      pending = []
              return entries

          def main():
              channel_languages = load_channel_languages()
              output = ["#EXTM3U"]
              seen_urls = set()
              total_added = 0

              for source in SOURCES:
                  name = source["name"]
                  url = source["url"]
                  filter_mode = source["filter"]

                  try:
                      text = download(url)
                      entries = parse_playlist(text)
                      added = 0
                      filtered = 0

                      for entry in entries:
                          extinf = entry[0]
                          stream_url = entry[-1].strip()

                          if filter_mode == "language":
                              if not language_allowed(
                                  extinf, channel_languages
                              ):
                                  filtered += 1
                                  continue

                          if stream_url in seen_urls:
                              continue

                          seen_urls.add(stream_url)
                          output.extend(entry)
                          added += 1

                      total_added += added
                      print(
                          f"OK: {name}: added {added}; "
                          f"filtered {filtered}; source entries {len(entries)}"
                      )

                  except Exception as exc:
                      print(f"WARNING: Skipped {name}: {exc}")

              if total_added == 0:
                  raise RuntimeError(
                      "No streams were merged; refusing to overwrite playlist."
                  )

              OUTPUT.write_text(
                  "\n".join(output) + "\n",
                  encoding="utf-8",
                  newline="\n",
              )
              print(f"Created {OUTPUT} with {total_added} unique streams.")

          if __name__ == "__main__":
              main()
          PY

          python merge_playlists.py

      - name: Commit and push updated playlist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add combined.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes to commit."
            exit 0
          fi

          git commit -m "Update combined IPTV playlist"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" &&
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Playlist pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed."
            sleep 2
          done

          echo "ERROR: Could not push playlist after 3 attempts."
          exit 1
